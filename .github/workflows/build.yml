name: AssetStudioBuild

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download FBX SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "fbx"
          Set-Location fbx
          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_win.exe" -OutFile "fbxsdk.exe"
          Start-Process -FilePath "fbxsdk.exe" -ArgumentList "/S" -Wait
          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_pdbs.exe" -OutFile "fbxpdb.exe"
          Start-Process -FilePath "fbxpdb.exe" -ArgumentList "/S" -Wait
          Set-Location ..

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Build Texture2DDecoderNative (Win32)
        run: msbuild Texture2DDecoderNative/Texture2DDecoderNative.vcxproj /p:Configuration=Release /p:Platform=Win32

      - name: Build Texture2DDecoderNative (x64)
        run: msbuild Texture2DDecoderNative/Texture2DDecoderNative.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Build AssetStudioFBXNative (Win32)
        run: msbuild AssetStudioFBXNative/AssetStudioFBXNative.vcxproj /p:Configuration=Release /p:Platform=Win32

      - name: Build AssetStudioFBXNative (x64)
        run: msbuild AssetStudioFBXNative/AssetStudioFBXNative.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Build AssetStudio (.NET 9)
        run: msbuild AssetStudioGUI/AssetStudioGUI.csproj /t:Publish /p:Configuration=Release /p:TargetFramework=net9.0-windows /p:SelfContained=false

      - name: Upload .NET 9 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio.net9
          path: AssetStudioGUI/bin/Release/net9.0-windows/publish
